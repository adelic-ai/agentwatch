apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: demo-k8s-agent-role
  namespace: default
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: demo-k8s-agent-binding
  namespace: default
subjects:
- kind: ServiceAccount
  name: demo-k8s-agent
  namespace: default
roleRef:
  kind: Role
  name: demo-k8s-agent-role
  apiGroup: rbac.authorization.k8s.io
