apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentwatch-ebpf-capture
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agentwatch-ebpf-capture-role
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agentwatch-ebpf-capture-binding
subjects:
- kind: ServiceAccount
  name: agentwatch-ebpf-capture
  namespace: default
roleRef:
  kind: ClusterRole
  name: agentwatch-ebpf-capture-role
  apiGroup: rbac.authorization.k8s.io
