apiVersion: v1
kind: Pod
metadata:
  name: demo-k8s-agent-run
  namespace: default
spec:
  serviceAccountName: demo-k8s-agent
  restartPolicy: Never
  containers:
  - name: agent
    image: bitnami/kubectl:latest
    command: ["sh", "-c"]
    args:
    - |
      echo "--- authorized: get configmap ---"
      kubectl get configmap agent-config -o yaml
      echo "--- UNAUTHORIZED: create secret (warrant already said FORBID for this) ---"
      kubectl create secret generic evil-secret --from-literal=x=1
